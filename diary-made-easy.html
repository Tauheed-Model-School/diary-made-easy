<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
  <title>Diary Made Easy</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f1f3ef;
      --surface: #ffffff;
      --surface-2: #e8ece7;
      --ink: #15251f;
      --muted: #54635e;
      --line: #cad2ce;
      --green: #093426;
      --green-2: #0f563f;
      --gold: #c9a227;
      --cream: #f5f0e1;
      --focus: #b88e0e;
      --danger: #9c3d34;
      --shadow: 0 20px 48px rgba(17, 45, 35, .11);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0f1714;
        --surface: #17221e;
        --surface-2: #202d28;
        --ink: #eef4f0;
        --muted: #abbab4;
        --line: #34453e;
        --green: #d8b84f;
        --green-2: #0f563f;
        --focus: #e8c974;
        --danger: #f0a39b;
        --shadow: 0 24px 56px rgba(0, 0, 0, .32);
      }
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: "Libre Franklin", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    main {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 28px clamp(16px, 4vw, 48px) calc(40px + env(safe-area-inset-bottom));
    }
    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }
    .intro h1 {
      margin: 0 0 7px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1;
      letter-spacing: -.025em;
      color: var(--ink);
    }
    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }
    .legend {
      flex: 0 0 auto;
      padding: 9px 12px;
      border-top: 2px solid var(--gold);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
      gap: 26px;
      align-items: start;
    }
    .editor {
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .editor-section { padding: 20px; }
    .editor-section + .editor-section { border-top: 1px solid var(--line); }
    .section-heading {
      margin: 0 0 15px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 12px;
    }
    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
    }
    input, textarea {
      display: block;
      width: 100%;
      margin-top: 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--page);
      color: var(--ink);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input { height: 44px; padding: 0 12px; }
    textarea {
      min-height: 78px;
      padding: 10px 12px;
      line-height: 1.6;
      resize: vertical;
      font-family: "Libre Franklin", "Noto Naskh Arabic", sans-serif;
    }
    input:focus, textarea:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent);
    }
    .rows { display: grid; gap: 13px; }
    .row-editor {
      position: relative;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 38px;
      gap: 9px;
      align-items: end;
      padding-bottom: 13px;
      border-bottom: 1px solid var(--line);
    }
    .row-editor:last-child { border-bottom: 0; padding-bottom: 0; }
    .remove {
      width: 38px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .remove:hover { background: var(--surface-2); color: var(--danger); }
    .remove:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .remove svg { width: 18px; height: 18px; }

    .add-row {
      width: 100%;
      height: 44px;
      margin-top: 14px;
      border: 1px dashed var(--green);
      border-radius: 6px;
      background: transparent;
      color: var(--green);
      font-weight: 800;
      cursor: pointer;
    }
    .add-row:hover { background: color-mix(in srgb, var(--green) 8%, transparent); }

    .download {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      background: #093426;
      color: #fffdf4;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 7px 0 #c9a227;
      transition: transform .12s, box-shadow .12s;
    }
    .download:hover { background: #0d4734; }
    .download:active { transform: translateY(4px); box-shadow: 0 3px 0 #c9a227; }
    .download:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .download svg { width: 20px; height: 20px; }
    .hint { margin: 13px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .preview-panel {
      position: sticky;
      top: 20px;
      min-width: 0;
    }
    .preview-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .preview-label span:last-child { font-weight: 500; }
    .canvas-shell {
      padding: clamp(9px, 2vw, 18px);
      background: var(--surface-2);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #f5f0e1;
      box-shadow: 0 5px 18px rgba(0, 0, 0, .12);
    }
    .status {
      min-height: 20px;
      margin: 14px 0 0;
      text-align: center;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      main { padding-top: 20px; }
      .intro { align-items: start; }
      .workspace { grid-template-columns: 1fr; }
      .preview-panel { position: static; }
      .editor { box-shadow: none; }
      .canvas-shell { box-shadow: none; }
    }
    @media (max-width: 520px) {
      .intro { display: block; }
      .legend { display: inline-block; margin-top: 16px; white-space: normal; }
      .editor-section { padding: 16px; }
      .meta-grid { grid-template-columns: 1fr; }
      .row-editor {
        grid-template-columns: minmax(0, 1fr) 38px;
        align-items: start;
      }
      .row-editor label:first-child { grid-column: 1 / 2; }
      .row-editor label:nth-child(2) { grid-column: 1 / 2; }
      .row-editor .remove { grid-column: 2; grid-row: 1; margin-top: 18px; }
      input, textarea { font-size: 16px; }
      .preview-label span:last-child { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro" aria-labelledby="page-heading">
      <div>
        <h1 id="page-heading">Prepare today’s diary</h1>
        <p>Type the classwork below. Your ready-to-send image updates as you write.</p>
      </div>
      <div class="legend" aria-label="Shortcut legend">L = Learn &nbsp;·&nbsp; T = Test &nbsp;·&nbsp; W = Write</div>
    </section>

    <div class="workspace">
      <form class="editor" id="diaryForm" autocomplete="off">
        <section class="editor-section">
          <h2 class="section-heading">Diary details</h2>
          <div class="meta-grid">
            <label>Class
              <input id="className" type="text" placeholder="e.g. Class 6th C" inputmode="text" />
            </label>
            <label>Date
              <input id="diaryDate" type="date" />
            </label>
          </div>
        </section>

        <section class="editor-section">
          <h2 class="section-heading">Homework</h2>
          <div class="rows" id="rows"></div>
          <button class="add-row" id="addRow" type="button">+ Add another subject</button>
        </section>

        <section class="editor-section">
          <button class="download" id="downloadBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download PNG
          </button>
          <p class="hint">Urdu and English can be mixed freely. Urdu numerals are changed to 0–9 automatically.</p>
          <p class="status" id="status" aria-live="polite"></p>
        </section>
      </form>

      <section class="preview-panel" aria-labelledby="preview-heading">
        <div class="preview-label"><span id="preview-heading">Live preview</span><span>PNG output · 1080 px wide</span></div>
        <div class="canvas-shell"><canvas id="diaryCanvas" width="1080" height="1350" aria-label="Preview of the school diary image"></canvas></div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      var rowsEl = document.getElementById('rows');
      var classInput = document.getElementById('className');
      var dateInput = document.getElementById('diaryDate');
      var canvas = document.getElementById('diaryCanvas');
      var statusEl = document.getElementById('status');
      var ctx = canvas.getContext('2d');
      var renderQueued = false;
      var rowCounter = 0;

      var defaultSubjects = ['English', 'Urdu', 'Mathematics', 'Science', 'Islamiat'];

      function todayValue() {
        var now = new Date();
        var y = now.getFullYear();
        var m = String(now.getMonth() + 1).padStart(2, '0');
        var d = String(now.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }

      function westernDigits(value) {
        return String(value || '')
          .replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })
          .replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); });
      }

      function expandShortcuts(value, finalPass) {
        var converted = westernDigits(value);
        var boundary = finalPass ? '(?=\\s|$)' : '(?=\\s)';
        return converted.replace(new RegExp('(^|\\s)([LTW])' + boundary, 'gi'), function (_, before, token) {
          var map = { l: 'Learn', t: 'Test', w: 'Write' };
          return before + map[token.toLowerCase()];
        });
      }

      function containsUrdu(text) {
        return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(text || '');
      }

      function setDirection(el) {
        el.dir = containsUrdu(el.value) ? 'rtl' : 'ltr';
        el.style.textAlign = containsUrdu(el.value) ? 'right' : 'left';
      }

      function iconTrash() {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }

      function createRow(subject, work) {
        rowCounter += 1;
        var wrapper = document.createElement('div');
        wrapper.className = 'row-editor';
        wrapper.dataset.row = String(rowCounter);

        var subjectLabel = document.createElement('label');
        subjectLabel.textContent = 'Subject';
        var subjectInput = document.createElement('input');
        subjectInput.type = 'text';
        subjectInput.placeholder = 'Subject';
        subjectInput.value = subject || '';
        subjectInput.setAttribute('aria-label', 'Subject');
        subjectLabel.appendChild(subjectInput);

        var workLabel = document.createElement('label');
        workLabel.textContent = 'Homework';
        var workInput = document.createElement('textarea');
        workInput.rows = 2;
        workInput.placeholder = 'Type homework here…';
        workInput.value = work || '';
        workInput.setAttribute('aria-label', 'Homework');
        workLabel.appendChild(workInput);

        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove';
        removeBtn.setAttribute('aria-label', 'Remove this subject');
        removeBtn.innerHTML = iconTrash();
        removeBtn.addEventListener('click', function () {
          if (rowsEl.children.length === 1) {
            subjectInput.value = '';
            workInput.value = '';
          } else {
            wrapper.remove();
          }
          queueRender();
        });

        [subjectInput, workInput].forEach(function (field) {
          setDirection(field);
          field.addEventListener('input', function () {
            var pos = field.selectionStart;
            var next = expandShortcuts(field.value, false);
            if (next !== field.value) {
              var added = next.length - field.value.length;
              field.value = next;
              if (pos !== null) field.setSelectionRange(pos + added, pos + added);
            }
            setDirection(field);
            queueRender();
          });
          field.addEventListener('blur', function () {
            field.value = expandShortcuts(field.value, true);
            setDirection(field);
            queueRender();
          });
        });

        wrapper.appendChild(subjectLabel);
        wrapper.appendChild(workLabel);
        wrapper.appendChild(removeBtn);
        rowsEl.appendChild(wrapper);
        queueRender();
        return workInput;
      }

      function getRows() {
        return Array.prototype.map.call(rowsEl.querySelectorAll('.row-editor'), function (row) {
          var fields = row.querySelectorAll('input, textarea');
          return {
            subject: westernDigits(fields[0].value.trim()),
            work: expandShortcuts(fields[1].value.trim(), true)
          };
        }).filter(function (row) { return row.subject || row.work; });
      }

      function formatDate(value) {
        if (!value) return '';
        var parts = value.split('-');
        if (parts.length !== 3) return value.toUpperCase();
        var months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
        return Number(parts[2]) + ' ' + months[Number(parts[1]) - 1] + ' ' + parts[0];
      }

      function roundRect(context, x, y, w, h, r) {
        var radius = Math.min(r, w / 2, h / 2);
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + w, y, x + w, y + h, radius);
        context.arcTo(x + w, y + h, x, y + h, radius);
        context.arcTo(x, y + h, x, y, radius);
        context.arcTo(x, y, x + w, y, radius);
        context.closePath();
      }

      function fontFor(text, size, weight) {
        var family = containsUrdu(text) ? '"Noto Naskh Arabic"' : '"Libre Franklin"';
        return (weight || 500) + ' ' + size + 'px ' + family;
      }

      function wrapText(text, maxWidth, font) {
        var cleaned = String(text || '').replace(/\s+/g, ' ').trim();
        if (!cleaned) return [''];
        ctx.font = font;
        var words = cleaned.split(' ');
        var lines = [];
        var line = '';

        function splitWideWord(word) {
          var pieces = [];
          var piece = '';
          Array.from(word).forEach(function (character) {
            var test = piece + character;
            if (piece && ctx.measureText(test).width > maxWidth) {
              pieces.push(piece);
              piece = character;
            } else {
              piece = test;
            }
          });
          if (piece) pieces.push(piece);
          return pieces;
        }

        words.forEach(function (word) {
          var pieces = ctx.measureText(word).width > maxWidth ? splitWideWord(word) : [word];
          pieces.forEach(function (piece, pieceIndex) {
            var canJoin = pieceIndex === 0;
            var test = line && canJoin ? line + ' ' + piece : piece;
            if (line && ctx.measureText(test).width > maxWidth) {
              lines.push(line);
              line = piece;
            } else if (line && canJoin) {
              line = test;
            } else if (line) {
              lines.push(line);
              line = piece;
            } else {
              line = piece;
            }
          });
        });
        if (line) lines.push(line);
        return lines;
      }

      function drawTextLines(lines, x, y, lineHeight, direction, color) {
        ctx.direction = direction;
        ctx.textAlign = direction === 'rtl' ? 'right' : 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = color;
        lines.forEach(function (line, index) {
          ctx.fillText(line || '—', x, y + index * lineHeight);
        });
        ctx.direction = 'ltr';
      }

      function renderDiary() {
        renderQueued = false;
        var W = 1080;
        var margin = 64;
        var contentW = W - margin * 2;
        var subjectW = 244;
        var gap = 36;
        var workW = contentW - subjectW - gap;
        var rows = getRows();
        if (!rows.length) rows = [{ subject: '', work: '' }];

        var tableY = 448;
        var tableHeaderH = 58;
        var measured = rows.map(function (row) {
          var sIsUrdu = containsUrdu(row.subject);
          var wIsUrdu = containsUrdu(row.work);
          var sFont = fontFor(row.subject, sIsUrdu ? 34 : 28, 700);
          var wFont = fontFor(row.work, wIsUrdu ? 35 : 29, 500);
          var sLines = wrapText(row.subject, subjectW - 38, sFont);
          var wLines = wrapText(row.work, workW - 38, wFont);
          var sLineHeight = sIsUrdu ? 52 : 46;
          var wLineHeight = wIsUrdu ? 52 : 46;
          var wrappedHeight = Math.max(
            55 + (sLines.length - 1) * sLineHeight + 32,
            55 + (wLines.length - 1) * wLineHeight + 32
          );
          return {
            row: row,
            sFont: sFont,
            wFont: wFont,
            sLines: sLines,
            wLines: wLines,
            sLineHeight: sLineHeight,
            wLineHeight: wLineHeight,
            h: Math.max(112, wrappedHeight)
          };
        });
        var rowsHeight = measured.reduce(function (sum, item) { return sum + item.h; }, 0);
        var rowsBottom = tableY + tableHeaderH + rowsHeight;
        var footerRuleY = rowsBottom + 30;
        var footerTextY = footerRuleY + 48;
        var H = footerTextY + 66;
        canvas.width = W;
        canvas.height = H;

        ctx.fillStyle = '#f5f0e1';
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = '#c9a227';
        ctx.lineWidth = 4;
        ctx.strokeRect(26, 26, W - 52, H - 52);
        ctx.strokeStyle = '#093426';
        ctx.lineWidth = 2;
        ctx.strokeRect(36, 36, W - 72, H - 72);

        ctx.fillStyle = '#093426';
        ctx.fillRect(50, 50, W - 100, 224);
        ctx.fillStyle = '#c9a227';
        ctx.fillRect(50, 274, W - 100, 8);

        ctx.textAlign = 'center';
        ctx.direction = 'ltr';
        ctx.fillStyle = '#fffdf4';
        ctx.font = '800 49px "Libre Franklin"';
        ctx.fillText('TAUHEED MODEL SCHOOL', W / 2, 140);
        ctx.fillStyle = '#e8c974';
        ctx.font = '700 24px "Libre Franklin"';
        ctx.fillText('DAILY HOME WORK', W / 2, 196);
        ctx.fillStyle = '#fffdf4';
        ctx.font = '500 17px "Libre Franklin"';
        ctx.fillText('LEARN  •  PRACTISE  •  GROW', W / 2, 235);

        var metaY = 318;
        var metaH = 96;
        var classText = westernDigits(classInput.value.trim()) || 'CLASS';
        var dateText = formatDate(dateInput.value) || 'DATE';

        ctx.fillStyle = '#efe4bf';
        roundRect(ctx, margin, metaY, 392, metaH, 10);
        ctx.fill();
        roundRect(ctx, margin + 412, metaY, contentW - 412, metaH, 10);
        ctx.fill();

        ctx.fillStyle = '#6e5b22';
        ctx.textAlign = 'left';
        ctx.font = '700 16px "Libre Franklin"';
        ctx.fillText('CLASS', margin + 24, metaY + 29);
        ctx.fillText('DATE', margin + 436, metaY + 29);

        ctx.fillStyle = '#093426';
        ctx.font = fontFor(classText, containsUrdu(classText) ? 34 : 28, 700);
        ctx.direction = containsUrdu(classText) ? 'rtl' : 'ltr';
        ctx.textAlign = containsUrdu(classText) ? 'right' : 'left';
        ctx.fillText(classText, containsUrdu(classText) ? margin + 368 : margin + 24, metaY + 70);
        ctx.direction = 'ltr';
        ctx.textAlign = 'left';
        ctx.font = '700 28px "Libre Franklin"';
        ctx.fillText(dateText, margin + 436, metaY + 70);

        ctx.fillStyle = '#093426';
        ctx.fillRect(margin, tableY, contentW, tableHeaderH);
        ctx.fillStyle = '#fffdf4';
        ctx.font = '700 20px "Libre Franklin"';
        ctx.textAlign = 'left';
        ctx.fillText('SUBJECT', margin + 20, tableY + 37);
        ctx.fillText('HOMEWORK', margin + subjectW + gap, tableY + 37);

        var y = tableY + tableHeaderH;
        measured.forEach(function (item, index) {
          if (index % 2 === 1) {
            ctx.fillStyle = '#efe9d8';
            ctx.fillRect(margin, y, contentW, item.h);
          }
          ctx.strokeStyle = '#cdbf92';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(margin, y + item.h);
          ctx.lineTo(margin + contentW, y + item.h);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(margin + subjectW + 16, y);
          ctx.lineTo(margin + subjectW + 16, y + item.h);
          ctx.stroke();

          var sRtl = containsUrdu(item.row.subject);
          var wRtl = containsUrdu(item.row.work);
          ctx.font = item.sFont;
          drawTextLines(item.sLines, sRtl ? margin + subjectW - 20 : margin + 20, y + 55, item.sLineHeight, sRtl ? 'rtl' : 'ltr', '#093426');
          ctx.font = item.wFont;
          drawTextLines(item.wLines, wRtl ? margin + contentW - 20 : margin + subjectW + gap, y + 55, item.wLineHeight, wRtl ? 'rtl' : 'ltr', '#18251f');
          y += item.h;
        });

        ctx.strokeStyle = '#c9a227';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(margin, footerRuleY);
        ctx.lineTo(W - margin, footerRuleY);
        ctx.stroke();
        ctx.fillStyle = '#395347';
        ctx.font = '600 19px "Libre Franklin"';
        ctx.textAlign = 'center';
        ctx.fillText('L = Learn   •   T = Test   •   W = Write', W / 2, footerTextY);
      }

      function queueRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(renderDiary);
      }

      document.getElementById('addRow').addEventListener('click', function () {
        var field = createRow('', '');
        field.focus();
      });

      classInput.addEventListener('input', function () {
        classInput.value = westernDigits(classInput.value);
        setDirection(classInput);
        queueRender();
      });
      dateInput.addEventListener('input', queueRender);

      document.getElementById('downloadBtn').addEventListener('click', function () {
        Array.prototype.forEach.call(rowsEl.querySelectorAll('input, textarea'), function (field) {
          field.value = expandShortcuts(field.value, true);
          setDirection(field);
        });
        renderDiary();
        var classPart = westernDigits(classInput.value.trim())
          .replace(/[^a-zA-Z0-9\u0600-\u06FF]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'class';
        var link = document.createElement('a');
        link.download = 'daily-homework-' + classPart + '-' + (dateInput.value || todayValue()) + '.png';
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        link.remove();
        statusEl.textContent = 'PNG downloaded — ready to send.';
        window.setTimeout(function () { statusEl.textContent = ''; }, 3500);
      });

      dateInput.value = todayValue();
      defaultSubjects.forEach(function (subject) { createRow(subject, ''); });
      setDirection(classInput);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(renderDiary);
      } else {
        renderDiary();
      }
    }());
  </script>
</body>
</html>
